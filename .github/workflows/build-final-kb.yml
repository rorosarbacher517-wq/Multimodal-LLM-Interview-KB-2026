name: Build final multimodal interview knowledge base

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-final-kb.yml'
      - '.kb_payload/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat .kb_payload/part_* > /tmp/kb.b64
          base64 -d /tmp/kb.b64 > /tmp/kbfinal.tar.xz
          mkdir -p /tmp/kb
          tar -xJf /tmp/kbfinal.tar.xz -C /tmp/kb

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.kb_payload' \
            -exec rm -rf {} +
          cp -a /tmp/kb/Multimodal-LLM-Interview-KB-2026/. .
          rm -rf .kb_payload
          rm -f .github/workflows/build-final-kb.yml

      - name: Audit repository
        shell: bash
        run: |
          python scripts/audit_repo.py

      - name: Commit final knowledge base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize 2026 multimodal LLM interview knowledge base [skip ci]"
          git push origin HEAD:main
